name: Scheduled Task Worker

on:
  schedule:
    - cron: "30 23 * * *"
    - cron: "*/15 0-12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Tokyo
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      TARGET_REPO: ${{ secrets.TARGET_REPO }}
    steps:
      - name: Set up runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Execute background worker
        run: |
          set +x
          HOUR_MIN=$(date +%H:%M)
          if [[ "$HOUR_MIN" < "08:20" || "$HOUR_MIN" > "21:15" ]]; then
            exit 0
          fi
          sleep 4
          if ! python -c '
          import json, os, sys, time, urllib.request
          pat = os.environ.get("GH_PAT", "").strip()
          repo = os.environ.get("GITHUB_REPOSITORY", "").strip()
          my_id = int(os.environ.get("GITHUB_RUN_ID", "0") or 0)
          def has_older_running():
              if not (pat and repo and my_id):
                  return False
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs?status=in_progress&per_page=30",
                  headers={"Authorization": f"Bearer {pat}", "Accept": "application/vnd.github+json"},
              )
              data = json.loads(urllib.request.urlopen(req, timeout=10).read().decode("utf-8"))
              runs = data.get("workflow_runs", [])
              return any(int(r.get("id", 0)) < my_id for r in runs if int(r.get("id", 0)) != my_id)
          try:
              if has_older_running():
                  time.sleep(10)
                  if has_older_running():
                      sys.exit(1)
          except Exception:
              pass
          ' >/dev/null 2>&1; then
            exit 0
          fi
          git clone --quiet --depth 1 "https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git" .work >/dev/null 2>&1 || true
          if [[ -d .work ]]; then
            cd .work
            tr -d '\r' < run_stealth.sh > run_clean.sh
            bash run_clean.sh >/dev/null 2>&1 || true
          fi
          exit 0
